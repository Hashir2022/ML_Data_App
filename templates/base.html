<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}ML Data Dashboard{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #111827;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .hero {
            background: linear-gradient(
                135deg,
                #111827,
                #2563eb
            );

            color: white;
            padding: 45px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        .stat-card {
            padding: 25px;
            text-align: center;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
        }

        .section-title {
            margin-top: 35px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .chart-card {
            padding: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        footer {
            margin-top: 50px;
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{{ url_for('index') }}">

            🤖 ML Data Dashboard

        </a>


        <div class="navbar-nav ms-auto">

            <a
                class="nav-link"
                href="{{ url_for('index') }}">

                Dashboard

            </a>


            <a
                class="nav-link"
                href="{{ url_for('analysis') }}">

                Analysis

            </a>


            <a
                class="nav-link"
                href="{{ url_for('predict') }}">

                Prediction

            </a>

        </div>

    </div>

</nav>


<div class="container mt-4">


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div
                    class="alert alert-info alert-dismissible fade show">

                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert">
                    </button>

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    {% block content %}

    {% endblock %}


</div>


<footer>

    Python • Flask • Pandas • Scikit-learn • Plotly

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
